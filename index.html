<!DOCTYPE html>
<html>
<head>
<title>AI Quiz</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #eeeeff;
    padding: 40px;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    max-width: 400px;
    margin: auto;
}

button {
    padding: 10px 20px;
    background: purple;
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>AI Quiz</h2>

<p>What is a prompt?</p>

<button onclick="check('A')">A. Query</button>
<button onclick="check('B')">B. Instruction</button>
<button onclick="check('C')">C. Dataset</button>

<p id="result"></p>
</div>

<script>
function check(answer) {
    if(answer === 'B') {
        document.getElementById("result").innerHTML =
        "Correct Answer!";
    } else {
        document.getElementById("result").innerHTML =
        "Try Again!";
    }
}
</script>

</body>
</html>
